name: Validate Contribution Receipts

on:
  pull_request:
    paths:
      - "CONTRIBUTIONS/**"
      - "src/cora_mcp/receipts.py"
      - "tests/test_receipts.py"
      - ".github/workflows/validate-contribution-receipts.yml"
  push:
    branches: [main]
    paths:
      - "CONTRIBUTIONS/**"
      - "src/cora_mcp/receipts.py"
      - "tests/test_receipts.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate canonical receipts
        run: PYTHONPATH=src python -m cora_mcp.receipts validate-all
      - name: Run receipt tests
        run: python -m unittest tests/test_receipts.py -v
