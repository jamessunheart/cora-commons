name: Bring a need
description: Describe an outcome that would make the Commons or its participants more capable.
title: "[Need]: "
labels: ["need", "needs-clarity"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should become true, and for whom?
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current situation
      description: What exists now, and what blocks the outcome?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What observable result would show this has been solved?
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Available resources and constraints
      description: Include known people, tools, budget, time, privacy boundaries and dependencies.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: I have not included credentials, private beneficiary details or sensitive financial information.
          required: true
