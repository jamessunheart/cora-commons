[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cora-commons-mcp"
version = "0.5.0"
description = "Read-only MCP connection to the public Cora Commons"
readme = "MCP.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=2.0,<3"]

[project.scripts]
cora-commons-mcp = "cora_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cora_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
